# ceph-csi objects the Helm route needs but the rook-ceph chart (v1.21.2) does not create:
#   - the OperatorConfig and the RBD / CephFS Driver objects (from upstream operator.yaml)
#   - the ServiceAccounts and RBAC the driver pods run as (from upstream csi-operator.yaml)
# The chart installs the ceph-csi-operator but expects these from a separate drivers chart. Without
# them there is no CSI driver, and no PVC can be provisioned. The kustomize route gets all of them
# from the upstream manifests. helm/operator.yaml sets the matching CSI_SERVICE_ACCOUNT_PREFIX
# (ceph-csi-) so the operator looks for these ServiceAccounts by the right names.
# Copied verbatim from
#   https://raw.githubusercontent.com/rook/rook/refs/tags/v1.21.2/deploy/examples/operator.yaml
#   https://raw.githubusercontent.com/rook/rook/refs/tags/v1.21.2/deploy/examples/csi-operator.yaml
#     (the ceph-csi-{rbd,cephfs}-{ctrl,node}plugin ServiceAccount, Role, ClusterRole and bindings)
# Re-copy them when bumping CHART_VERSION. Applied by `make helm` after the operator chart.
# OperatorConfig defines the default settings for all CSI drivers.
apiVersion: csi.ceph.io/v1
kind: OperatorConfig
metadata:
  name: ceph-csi-operator-config
  namespace: rook-ceph # namespace:operator
spec:
  driverSpecDefaults:
    log:
      verbosity: 0
    imageSet:
      name: rook-csi-operator-image-set-configmap
    enableMetadata: true
    generateOMapInfo: false
    fsGroupPolicy: File
    deployCsiAddons: false
    cephFsClientType: kernel
    nodePlugin:
      priorityClassName: "system-node-critical"
      kubeletDirPath: /var/lib/kubelet
      enableSeLinuxHostMount: false
    controllerPlugin:
      priorityClassName: "system-cluster-critical"
      deploymentStrategy:
        type: Recreate
---
# RBD CSI Driver
apiVersion: csi.ceph.io/v1
kind: Driver
metadata:
  name: rook-ceph.rbd.csi.ceph.com # csi-provisioner-name
  namespace: rook-ceph # namespace:operator
spec:
  fsGroupPolicy: File
  nodePlugin:
    updateStrategy:
      type: RollingUpdate
  controllerPlugin: {}
---
# CephFS CSI Driver
apiVersion: csi.ceph.io/v1
kind: Driver
metadata:
  name: rook-ceph.cephfs.csi.ceph.com # csi-provisioner-name
  namespace: rook-ceph # namespace:operator
spec:
  fsGroupPolicy: File
  cephFsClientType: kernel
  nodePlugin:
    updateStrategy:
      type: RollingUpdate
  controllerPlugin: {}
---
