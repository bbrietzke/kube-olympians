apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: rook-prerequisites-kustomization
namespace: rook-ceph
resources:
- https://raw.githubusercontent.com/rook/rook/refs/tags/v1.21.2/deploy/examples/crds.yaml
- https://raw.githubusercontent.com/rook/rook/refs/tags/v1.21.2/deploy/examples/common.yaml
- https://raw.githubusercontent.com/rook/rook/refs/tags/v1.21.2/deploy/examples/csi-operator.yaml

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize

# Talos enforces Pod Security Admission (only kube-system is exempt). The OSD, mon and CSI pods
# need host access, so the namespace that common.yaml creates must allow privileged pods.
patches:
  - target:
      kind: Namespace
      name: rook-ceph
    patch: |-
      - op: add
        path: /metadata/labels
        value:
          pod-security.kubernetes.io/enforce: privileged
          pod-security.kubernetes.io/audit: privileged
          pod-security.kubernetes.io/warn: privileged
          cost-center: platform
