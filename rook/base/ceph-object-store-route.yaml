---
# The "s3" object store on the LAN, HTTPS only (TLS ends at traefik-gateway; plain HTTP is
# redirected with a 301 before routing):
#   https://s3.faultycloud.xyz/<bucket>/<key>      path-style
#   https://<bucket>.s3.faultycloud.xyz/<key>      virtual-hosted-style (needs the websecure-s3
#                                                  listener and certificate, traefik/helm/postCertManager.yaml)
# LAN only: traefik-gateway is not reachable through the Cloudflare tunnel. The rook-ceph namespace
# carries olympians/traefik-gateway=allowed (set by `make olympians`) so this route can attach.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: s3
  namespace: rook-ceph
spec:
  parentRefs:
    - {name: traefik-gateway, namespace: traefik}
  hostnames:
    - s3.faultycloud.xyz
    - "*.s3.faultycloud.xyz"
  rules:
    - backendRefs:
        - name: rook-ceph-rgw-s3
          port: 80
