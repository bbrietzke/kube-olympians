apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: brietzke-auth-olympians-kustomization
# Everything except the public route (overlays/public), so the first-run /setup page is never
# reachable before you're ready to claim the admin account.
resources:
- ../../base

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
