apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: brietzke-auth-base-kustomization
resources:
  - namespace.yaml
  - database.yaml
  - config.yaml
  - pocket-id.yaml

# Generated by `make prerequisites` and kept out of git (templates: *.env.example).
secretGenerator:
  # The PostgreSQL login for the "pocketid" role, read by CloudNativePG.
  - name: pocketid-db-credentials
    namespace: db
    type: kubernetes.io/basic-auth
    envs:
      - pocketid-db.env
    options:
      disableNameSuffixHash: true
  # ENCRYPTION_KEY and DB_CONNECTION_STRING (which embeds the same DB password) for Pocket ID.
  # The hash suffix rolls the pod when either changes.
  - name: pocket-id-secrets
    namespace: pocket-id
    envs:
      - pocket-id.env
