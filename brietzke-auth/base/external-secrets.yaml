# Pocket ID's secrets, from Bitwarden Secrets Manager through the "bitwarden" ClusterSecretStore
# (external-secrets/). The DB password (Bitwarden db/pocketid-db-credentials/password) feeds both
# the role's Secret and Pocket ID's connection string, so they can't drift apart.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocketid-db-credentials
  namespace: db
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: bitwarden}
  target:
    # The PostgreSQL login for the "pocketid" role, read by CloudNativePG.
    name: pocketid-db-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: pocketid
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: db/pocketid-db-credentials/password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id-secrets
  namespace: pocket-id
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: bitwarden}
  target:
    # envFrom in pocket-id.yaml. ENCRYPTION_KEY encrypts Pocket ID's signing keys in the database:
    # losing it invalidates every token and means re-creating the keys.
    name: pocket-id-secrets
    creationPolicy: Owner
    template:
      data:
        ENCRYPTION_KEY: "{{ .encryptionKey }}"
        DB_CONNECTION_STRING: "postgres://pocketid:{{ .password }}@cluster00-rw.db.svc:5432/pocketid?sslmode=require"
  data:
    - secretKey: encryptionKey
      remoteRef:
        key: pocket-id/pocket-id-secrets/ENCRYPTION_KEY
    - secretKey: password
      remoteRef:
        key: db/pocketid-db-credentials/password
