# Pocket ID: the OIDC login provider for brietzke.me apps. Public only (traefik-public Gateway),
# because every browser that logs in has to reach it.
apiVersion: v1
kind: Namespace
metadata:
  name: pocket-id
  labels:
    olympians/exposure: public
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
