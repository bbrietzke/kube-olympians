apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: brietzke-video-base-kustomization
namespace: mirotalk
resources:
  - namespace.yaml
  - config.yaml
  - mirotalk.yaml

# mirotalk.env is kept out of git. `make prerequisites` generates API_KEY_SECRET and
# SESSION_SECRET; OIDC_CLIENT_ID / OIDC_CLIENT_SECRET come from the Pocket ID client.
secretGenerator:
  - name: mirotalk-secrets
    envs:
      - mirotalk.env
