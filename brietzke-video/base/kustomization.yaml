apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: brietzke-video-base-kustomization
namespace: mirotalk
resources:
  - namespace.yaml
  - config.yaml
  - mirotalk.yaml

# mirotalk.env is generated by `make prerequisites` and kept out of git.
secretGenerator:
  - name: mirotalk-secrets
    envs:
      - mirotalk.env

