apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: brietzke-video-base-kustomization
namespace: mirotalk
resources:
  - namespace.yaml
  - config.yaml
  - mirotalk.yaml
  - basic-auth.yaml

# Both source files are generated by `make prerequisites` and kept out of git.
secretGenerator:
  - name: mirotalk-secrets
    envs:
      - mirotalk.env
  # bcrypt htpasswd line(s) for the basic-auth Middleware. No name suffix: the Middleware refers to
  # the Secret by name, and kustomize can't rewrite that field in a Traefik CRD.
  - name: mirotalk-basic-auth
    files:
      - users=basic-auth.htpasswd
    options:
      disableNameSuffixHash: true

