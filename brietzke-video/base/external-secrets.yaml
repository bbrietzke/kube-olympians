# MiroTalk's secrets, from Bitwarden Secrets Manager through the "bitwarden" ClusterSecretStore
# (external-secrets/). Bitwarden secrets: mirotalk/mirotalk-secrets/<key>.
#   API_KEY_SECRET, SESSION_SECRET: random, generated once
#   OIDC_CLIENT_ID, OIDC_CLIENT_SECRET: the Pocket ID client "MiroTalk" (see README.md)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mirotalk-secrets
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: bitwarden}
  target:
    name: mirotalk-secrets       # envFrom in mirotalk.yaml
    creationPolicy: Owner
  data:
    - secretKey: API_KEY_SECRET
      remoteRef: {key: mirotalk/mirotalk-secrets/API_KEY_SECRET}
    - secretKey: SESSION_SECRET
      remoteRef: {key: mirotalk/mirotalk-secrets/SESSION_SECRET}
    - secretKey: OIDC_CLIENT_ID
      remoteRef: {key: mirotalk/mirotalk-secrets/OIDC_CLIENT_ID}
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef: {key: mirotalk/mirotalk-secrets/OIDC_CLIENT_SECRET}
