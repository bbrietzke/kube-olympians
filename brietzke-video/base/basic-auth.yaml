# HTTP basic auth in front of video.brietzke.me, to keep uninvited visitors out. One shared login
# that you pass to whoever you're calling; browsers remember it for the session, including for the
# Socket.IO WebSocket on the same origin.
#
# The Secret holds only a bcrypt hash (key "users", htpasswd format), generated by
# `make prerequisites` from the git-ignored base/basic-auth.env (plaintext, local only).
# removeHeader strips the Authorization header so MiroTalk never sees the password.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: basic-auth
  namespace: mirotalk
spec:
  basicAuth:
    secret: mirotalk-basic-auth
    realm: video.brietzke.me
    removeHeader: true
