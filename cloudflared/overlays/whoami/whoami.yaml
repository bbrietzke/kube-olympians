# Test app for the tunnel, served on both networks by one HTTPRoute:
#   https://whoami.brietzke.me      internet -> Cloudflare -> cloudflared -> traefik-public
#   https://whoami.faultycloud.xyz  LAN -> 192.168.3.200 -> traefik-gateway
# Each Gateway serves only the hostnames matching its own listeners.
apiVersion: v1
kind: Namespace
metadata:
  name: whoami
  labels:
    olympians/traefik-gateway: allowed   # LAN Gateway
    olympians/exposure: public           # public Gateway
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: whoami
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: whoami
  template:
    metadata:
      labels:
        app.kubernetes.io/name: whoami
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: whoami
          image: traefik/whoami:v1.12.0
          args: ["--port", "8080"]
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: whoami
spec:
  selector:
    app.kubernetes.io/name: whoami
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami
  namespace: whoami
spec:
  parentRefs:
    - {name: traefik-gateway, namespace: traefik}
    - {name: traefik-public, namespace: traefik}
  hostnames:
    - whoami.faultycloud.xyz
    - whoami.brietzke.me
  rules:
    - backendRefs:
        - name: whoami
          port: 80
