apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: cloudflared-base-kustomization
namespace: cloudflared
resources:
  - namespace.yaml
  - deployment.yaml

# The tunnel token comes from cloudflared.env, a local file kept out of git.
# Copy cloudflared.env.example to cloudflared.env and fill in the token.
secretGenerator:
  - name: cloudflared-tunnel-token
    envs:
      - cloudflared.env
