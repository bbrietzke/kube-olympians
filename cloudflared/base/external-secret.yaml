# The Cloudflare Tunnel token for the connector, from Bitwarden Secrets Manager through the
# "bitwarden" ClusterSecretStore (external-secrets/). Bitwarden secret:
# cloudflared/cloudflared-tunnel-token/TUNNEL_TOKEN
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared-tunnel-token
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: bitwarden}
  target:
    name: cloudflared-tunnel-token    # secretKeyRef in deployment.yaml
    creationPolicy: Owner
  data:
    - secretKey: TUNNEL_TOKEN
      remoteRef:
        key: cloudflared/cloudflared-tunnel-token/TUNNEL_TOKEN
