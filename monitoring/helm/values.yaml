# kube-prometheus-stack (https://github.com/prometheus-community/helm-charts), pinned in ../Makefile.
# Prometheus Operator + Prometheus + Alertmanager + Grafana + node-exporter + kube-state-metrics.

# Talos specifics:
# - kube-proxy is disabled (Cilium replaces it).
# - kube-scheduler, kube-controller-manager and etcd bind their metrics to 127.0.0.1 on zeus by
#   default, so they can't be scraped. Their scrapes and alert rules stay off until the Talos
#   control-plane config exposes them (bind-address / listen-metrics-urls).
kubeProxy:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false
defaultRules:
  rules:
    etcd: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeControllerManager: false

prometheus:
  prometheusSpec:
    externalUrl: https://prometheus.faultycloud.xyz
    # Pick up ServiceMonitors, PodMonitors, Probes, ScrapeConfigs and rules from every namespace,
    # not only the ones this chart labels, so other components (Rook, CNPG, Cilium, Traefik) can
    # ship their own monitors.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 30d
    retentionSize: 45GB          # below the 50Gi volume, so retention trims before the disk fills
    # The TSDB does lots of small random writes: SSD, not the SMR HDDs.
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: rook-ceph-ssd
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        memory: 6Gi
  route:
    main:
      enabled: true
      hostnames: [prometheus.faultycloud.xyz]
      parentRefs:
        - {name: traefik-gateway, namespace: traefik}

alertmanager:
  # Notifications go to Pushover. Only route and receivers are set here; the chart's default
  # global settings and inhibit rules (critical mutes warning/info, ...) are kept, because Helm
  # merges this map with the chart's. The credentials are files from Secret alertmanager-pushover
  # (base/pushover.env, git-ignored), so nothing secret is in this file.
  config:
    route:
      receiver: pushover
      group_by: [namespace, alertname]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        # Always-firing helpers, not problems.
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"
        - receiver: "null"
          matchers:
            - alertname = "InfoInhibitor"
    receivers:
      - name: "null"
      - name: pushover
        pushover_configs:
          - user_key_file: /etc/alertmanager/secrets/alertmanager-pushover/user_key
            token_file: /etc/alertmanager/secrets/alertmanager-pushover/token
            send_resolved: true
            # Pushover priority: 1 (high, bypasses quiet hours) for critical, 0 for anything else
            # that's firing, -1 (quiet) for "resolved".
            priority: '{{ if eq .Status "firing" }}{{ if eq .CommonLabels.severity "critical" }}1{{ else }}0{{ end }}{{ else }}-1{{ end }}'
            url: https://alertmanager.faultycloud.xyz
            url_title: Open Alertmanager
  alertmanagerSpec:
    externalUrl: https://alertmanager.faultycloud.xyz
    secrets:
      - alertmanager-pushover
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: rook-ceph-ssd
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi
  # No receivers yet: alerts are visible in the UI only. Add one (email, Discord, webhook, ...)
  # under alertmanager.config to get notified.
  route:
    main:
      enabled: true
      hostnames: [alertmanager.faultycloud.xyz]
      parentRefs:
        - {name: traefik-gateway, namespace: traefik}

# Chargeback (opencost/): kube-state-metrics exports no Kubernetes labels by default. Allow only
# cost-center on PVCs, so storage can be charged to a PVC's own cost center (kube_persistent-
# volumeclaim_labels{label_cost_center}). Pod and namespace labels already come from OpenCost's own
# kube_pod_labels / kube_namespace_labels; adding them here would duplicate those series.
kube-state-metrics:
  metricLabelsAllowlist:
    - persistentvolumeclaims=[cost-center]

grafana:
  admin:
    existingSecret: grafana-admin     # base/grafana-admin.env, generated by `make prerequisites`
    userKey: admin-user
    passwordKey: admin-password
  grafana.ini:
    server:
      root_url: https://grafana.faultycloud.xyz
    analytics:
      reporting_enabled: false
      check_for_updates: false
  # Users, saved dashboards and settings. Dashboards from the chart come from ConfigMaps (sidecar).
  persistence:
    enabled: true
    storageClassName: rook-ceph-ssd
    size: 5Gi
  # The volume is ReadWriteOnce, so the old pod must stop before the new one starts.
  deploymentStrategy:
    type: Recreate
  # Extra dashboards from grafana.com, downloaded by Grafana's init container at startup and
  # pinned to a revision. The Ceph ones are those Rook's monitoring docs recommend; their data
  # comes from the ServiceMonitors Rook creates (rook/helm/cluster.yaml monitoring.enabled).
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: ceph
          orgId: 1
          folder: Ceph
          type: file
          disableDeletion: true
          editable: false
          options:
            path: /var/lib/grafana/dashboards/ceph
  dashboards:
    ceph:
      ceph-cluster:
        gnetId: 2842        # Ceph Cluster
        revision: 18
        datasource: Prometheus
      ceph-osd:
        gnetId: 5336        # Ceph - OSD (Single)
        revision: 9
        datasource: Prometheus
      ceph-pools:
        gnetId: 5342        # Ceph - Pools
        revision: 9
        datasource: Prometheus
  route:
    main:
      enabled: true
      hostnames: [grafana.faultycloud.xyz]
      parentRefs:
        - {name: traefik-gateway, namespace: traefik}
