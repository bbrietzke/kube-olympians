# kube-prometheus-stack (https://github.com/prometheus-community/helm-charts), pinned in ../Makefile.
# Prometheus Operator + Prometheus + Alertmanager + Grafana + node-exporter + kube-state-metrics.

# Talos specifics:
# - kube-proxy is disabled (Cilium replaces it).
# - kube-scheduler, kube-controller-manager and etcd bind their metrics to 127.0.0.1 on zeus by
#   default, so they can't be scraped. Their scrapes and alert rules stay off until the Talos
#   control-plane config exposes them (bind-address / listen-metrics-urls).
kubeProxy:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false
defaultRules:
  rules:
    etcd: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeControllerManager: false

prometheus:
  prometheusSpec:
    externalUrl: https://prometheus.faultycloud.xyz
    # Pick up ServiceMonitors, PodMonitors, Probes, ScrapeConfigs and rules from every namespace,
    # not only the ones this chart labels, so other components (Rook, CNPG, Cilium, Traefik) can
    # ship their own monitors.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 30d
    retentionSize: 45GB          # below the 50Gi volume, so retention trims before the disk fills
    # The TSDB does lots of small random writes: SSD, not the SMR HDDs.
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: rook-ceph-ssd
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        memory: 6Gi
  route:
    main:
      enabled: true
      hostnames: [prometheus.faultycloud.xyz]
      parentRefs:
        - {name: traefik-gateway, namespace: traefik}

alertmanager:
  alertmanagerSpec:
    externalUrl: https://alertmanager.faultycloud.xyz
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: rook-ceph-ssd
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi
  # No receivers yet: alerts are visible in the UI only. Add one (email, Discord, webhook, ...)
  # under alertmanager.config to get notified.
  route:
    main:
      enabled: true
      hostnames: [alertmanager.faultycloud.xyz]
      parentRefs:
        - {name: traefik-gateway, namespace: traefik}

grafana:
  admin:
    existingSecret: grafana-admin     # base/grafana-admin.env, generated by `make prerequisites`
    userKey: admin-user
    passwordKey: admin-password
  grafana.ini:
    server:
      root_url: https://grafana.faultycloud.xyz
    analytics:
      reporting_enabled: false
      check_for_updates: false
  # Users, saved dashboards and settings. Dashboards from the chart come from ConfigMaps (sidecar).
  persistence:
    enabled: true
    storageClassName: rook-ceph-ssd
    size: 5Gi
  # The volume is ReadWriteOnce, so the old pod must stop before the new one starts.
  deploymentStrategy:
    type: Recreate
  route:
    main:
      enabled: true
      hostnames: [grafana.faultycloud.xyz]
      parentRefs:
        - {name: traefik-gateway, namespace: traefik}
