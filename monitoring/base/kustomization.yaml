apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: monitoring-base-kustomization
namespace: monitoring
resources:
  - namespace.yaml

# grafana-admin.env is generated by `make prerequisites` and kept out of git.
secretGenerator:
  - name: grafana-admin
    envs:
      - grafana-admin.env
    options:
      # The chart refers to the Secret by this exact name.
      disableNameSuffixHash: true
  # Pushover user key and app token, mounted into Alertmanager at
  # /etc/alertmanager/secrets/alertmanager-pushover/{user_key,token} (alertmanagerSpec.secrets).
  - name: alertmanager-pushover
    envs:
      - pushover.env
    options:
      disableNameSuffixHash: true

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
