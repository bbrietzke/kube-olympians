apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: monitoring-base-kustomization
namespace: monitoring
resources:
  - namespace.yaml
  # Grafana admin login and Pushover credentials, from Bitwarden (needs external-secrets/ first).
  - external-secrets.yaml

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
