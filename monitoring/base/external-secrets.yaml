# Grafana's admin login and the Pushover credentials, from Bitwarden Secrets Manager through the
# "bitwarden" ClusterSecretStore (external-secrets/).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: bitwarden}
  target:
    # The chart refers to the Secret by this exact name (grafana.admin.existingSecret).
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef: {key: monitoring/grafana-admin/admin-user}
    - secretKey: admin-password
      remoteRef: {key: monitoring/grafana-admin/admin-password}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-pushover
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: bitwarden}
  target:
    # Mounted into Alertmanager at /etc/alertmanager/secrets/alertmanager-pushover/{user_key,token}
    # (alertmanagerSpec.secrets). Alertmanager reads the files on each notification.
    name: alertmanager-pushover
    creationPolicy: Owner
  data:
    - secretKey: user_key
      remoteRef: {key: monitoring/alertmanager-pushover/user_key}
    - secretKey: token
      remoteRef: {key: monitoring/alertmanager-pushover/token}
