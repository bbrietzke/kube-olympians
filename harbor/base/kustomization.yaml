apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: harbor-base-kustomization
resources:
  - namespace.yaml
  - database-role.yaml
  - database.yaml

# Passwords come from local files kept out of git. `make prerequisites` generates them with random
# values if they don't exist (templates: *.env.example).
secretGenerator:
  # The PostgreSQL login for the "harbor" role, read by CloudNativePG (cluster00 managed role).
  - name: harbor-db-credentials
    namespace: db
    type: kubernetes.io/basic-auth
    envs:
      - harbor-db.env
    options:
      disableNameSuffixHash: true
  # The same password for Harbor itself (chart database.external.existingSecret, key "password").
  - name: harbor-database
    namespace: harbor
    envs:
      - harbor-db.env
    options:
      disableNameSuffixHash: true
  # Harbor's initial admin password (chart existingSecretAdminPassword).
  - name: harbor-admin
    namespace: harbor
    envs:
      - harbor-admin.env
    options:
      disableNameSuffixHash: true
