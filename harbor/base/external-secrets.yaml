# Harbor's passwords, from Bitwarden Secrets Manager through the "bitwarden" ClusterSecretStore
# (external-secrets/). One DB password (Bitwarden db/harbor-db-credentials/password) feeds both the
# role's Secret in db and Harbor's copy in harbor, so the two can't drift apart.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-db-credentials
  namespace: db
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: bitwarden}
  target:
    # The PostgreSQL login for the "harbor" role, read by CloudNativePG (DatabaseRole).
    name: harbor-db-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: harbor
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: db/harbor-db-credentials/password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-database
  namespace: harbor
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: bitwarden}
  target:
    # Harbor's copy (chart database.external.existingSecret, key "password").
    name: harbor-database
    creationPolicy: Owner
    template:
      data:
        username: harbor
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: db/harbor-db-credentials/password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-admin
  namespace: harbor
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: bitwarden}
  target:
    # Harbor's initial admin password (chart existingSecretAdminPassword).
    name: harbor-admin
    creationPolicy: Owner
  data:
    - secretKey: HARBOR_ADMIN_PASSWORD
      remoteRef:
        key: harbor/harbor-admin/HARBOR_ADMIN_PASSWORD
