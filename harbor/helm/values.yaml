# Harbor on the olympians cluster: goharbor/harbor chart 1.19.4 running Harbor v2.16.0 images.
#
# Why the tag override: chart 1.19.4 is the newest released chart and was built for 2.15.4. The
# olympians nodes are amd64, so 2.15.4 would run, but this keeps the same Harbor version as the
# demigods (arm64) cluster, where 2.16.0 (2026-11-10) is the first release with arm64 images.
# Switch to the first chart release for 2.16 when it ships, then drop these tag overrides.
#
# Exposure: an HTTPRoute on traefik-gateway (TLS ends at the Gateway, wildcard *.faultycloud.xyz).
# Database: the "harbor" database in the CloudNativePG cluster00 (db namespace).
# Cache/queue: Harbor's internal Valkey. Storage: rook-ceph-hdd PVCs (the default class).

externalURL: https://harbor.faultycloud.xyz

expose:
  type: route
  tls:
    # TLS is terminated by Traefik at the Gateway; Harbor's Services speak plain HTTP.
    enabled: false
  route:
    parentRefs:
      - name: traefik-gateway
        namespace: traefik
    hosts:
      - harbor.faultycloud.xyz

# Admin password from the harbor-admin Secret (generated by `make prerequisites`).
existingSecretAdminPassword: harbor-admin
existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD

database:
  type: external
  external:
    host: cluster00-rw.db.svc
    port: "5432"
    username: harbor
    coreDatabase: harbor
    # Secret harbor-database (harbor namespace), key "password"; same value as the CNPG role's
    # harbor-db-credentials Secret in the db namespace.
    existingSecret: harbor-database
    # CloudNativePG serves TLS with its own CA; require encrypts without verifying that CA.
    sslmode: require
  # cluster00 is shared and allows 100 connections in total (PostgreSQL default). Harbor's
  # defaults (900 open / 100 idle, per component) would exhaust it.
  maxOpenConns: 30
  maxIdleConns: 5

persistence:
  enabled: true
  # Keep PVCs (image layers, job logs) if the release is uninstalled.
  resourcePolicy: "keep"
  imageChartStorage:
    type: filesystem
  persistentVolumeClaim:
    registry:
      storageClass: rook-ceph-hdd
      size: 100Gi
    jobservice:
      jobLog:
        storageClass: rook-ceph-hdd
        size: 1Gi
    redis:
      storageClass: rook-ceph-hdd
      size: 1Gi
    trivy:
      storageClass: rook-ceph-hdd
      size: 5Gi

metrics:
  enabled: false

trivy:
  enabled: true
  image:
    tag: v2.16.0

# --- v2.16.0 images (multi-arch) -------------------------------------------------
portal:
  image:
    tag: v2.16.0
core:
  image:
    tag: v2.16.0
jobservice:
  image:
    tag: v2.16.0
registry:
  registry:
    image:
      tag: v2.16.0
  controller:
    image:
      tag: v2.16.0
redis:
  type: internal
  internal:
    image:
      tag: v2.16.0
exporter:
  image:
    tag: v2.16.0
nginx:
  # Not deployed with expose.type route; pinned anyway so every image is the same version.
  image:
    tag: v2.16.0
