# One-off pushes of existing Secrets into Bitwarden, one Bitwarden secret per key, named
# <namespace>/<secret>/<key> (without kustomize's hash suffix).
# `make rescue` applies these and waits; `make rescue-done` deletes them. deletionPolicy None keeps
# the Bitwarden copies. Batch 1 (2026-11-27): the cluster-only Secrets of certificateManager,
# postgresql, harbor and forgejo. Batch 2 (this file): brietzke-auth, brietzke-video, cloudflared,
# monitoring, whose .env files were checked identical to the cluster first.
# Pocket ID's DB_CONNECTION_STRING isn't pushed: its ExternalSecret builds it from the DB password.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: rescue-pocketid-db-credentials
  namespace: db
  labels:
    olympians/secrets-rescue: "true"
spec:
  refreshInterval: 1h
  deletionPolicy: None
  updatePolicy: Replace
  secretStoreRefs:
    - name: bitwarden
      kind: ClusterSecretStore
  selector:
    secret:
      name: pocketid-db-credentials
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: db/pocketid-db-credentials/password
---
