apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: external-secrets-prerequisites-kustomization
# Before the Helm install: the namespace and the SDK server's TLS certificate (it mounts the Secret).
resources:
  - namespace.yaml
  - sdk-server-tls.yaml

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
