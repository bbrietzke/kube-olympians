# The one store for the cluster: Bitwarden Secrets Manager (US cloud), organization + project
# "olympians". A store is bound to exactly one project. The IDs aren't secret; the machine
# account's access token is (Secret bitwarden-access-token, from base/bitwarden.env).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: bitwarden
spec:
  provider:
    bitwardensecretsmanager:
      apiURL: https://api.bitwarden.com
      identityURL: https://identity.bitwarden.com
      organizationID: 86103964-cfc9-4e0b-91d9-b50f00d96755
      projectID: 6e97d616-6387-4327-ba9f-b50f00fe9055
      bitwardenServerSDKURL: https://bitwarden-sdk-server.external-secrets.svc.cluster.local:9998
      caProvider:
        type: Secret
        name: bitwarden-sdk-ca
        namespace: external-secrets
        key: ca.crt
      auth:
        secretRef:
          credentials:
            name: bitwarden-access-token
            namespace: external-secrets
            key: token
