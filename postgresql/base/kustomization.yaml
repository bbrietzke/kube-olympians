apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: postgresql-base-kustomized
resources:
  - cluster00.yaml
  - namespace.yaml
  - object-store.yaml
  # The Backblaze B2 key, from Bitwarden (needs external-secrets/ first).
  - external-secret.yaml

labels:
  - includeSelectors: true
    pairs:
      app: postgresql
