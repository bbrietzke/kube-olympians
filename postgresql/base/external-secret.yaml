# The Backblaze B2 application key for the Barman Cloud ObjectStore "backblaze" (WAL archive and
# base backups of cluster00), from Bitwarden Secrets Manager through the "bitwarden"
# ClusterSecretStore (external-secrets/). Bitwarden secrets: db/backblaze-b2/<key>.
# Keeping it outside the cluster is what makes a restore from B2 possible after losing the cluster.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backblaze-b2
  namespace: db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    # The ObjectStore refers to the Secret by this exact name.
    name: backblaze-b2
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: db/backblaze-b2/ACCESS_KEY_ID
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: db/backblaze-b2/ACCESS_SECRET_KEY
