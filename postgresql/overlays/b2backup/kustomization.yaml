apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: postgresql-b2backup-kustomization
# One on-demand CNPG Backup (method: plugin, Barman Cloud to Backblaze B2). Used by
# `make b2backup`, which gives it a unique name.
resources:
- backup.yaml

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
      olympians/backup-type: adhoc
      # CNPG sets this on scheduled Backups but not on hand-made ones; `make snapshots` selects on it.
      cnpg.io/cluster: cluster00
