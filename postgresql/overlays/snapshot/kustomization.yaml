apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: postgresql-snapshot-kustomization
# One on-demand CNPG Backup (method: volumeSnapshot). Used by `make snapshot`, which gives it a
# unique name; kustomize cannot build an object without metadata.name, so generateName is not an option.
resources:
- backup.yaml

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
      olympians/backup-type: adhoc
      # CNPG sets this on scheduled Backups but not on hand-made ones; `make snapshots` selects on it.
      cnpg.io/cluster: cluster00
