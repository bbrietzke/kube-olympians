apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: postgresql-install-kustomization
# CloudNativePG operator v1.30.2: CRDs, RBAC, webhooks and the controller in cnpg-system.
# Release asset sha256 ea4cc355b394e10661d30c6b409cefb19029dd973bccb76b1ed8c789985bc68c.
# Operator and default operand (postgresql:18.7-system-trixie) images are multi-arch (amd64 + arm64).
resources:
- https://github.com/cloudnative-pg/cloudnative-pg/releases/download/v1.30.2/cnpg-1.30.2.yaml

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
