# `make smoke-test`: one GPU, nvidia-smi, then exit. The nvidia RuntimeClass (created by the operator)
# runs it with the Talos nvidia container runtime, which mounts the driver into the container.
apiVersion: v1
kind: Pod
metadata:
  name: gpu-smoke-test
  labels:
    app.kubernetes.io/name: gpu-smoke-test
spec:
  restartPolicy: Never
  runtimeClassName: nvidia
  containers:
    - name: nvidia-smi
      image: nvcr.io/nvidia/cuda:12.9.1-base-ubuntu24.04
      command: ["nvidia-smi"]
      resources:
        limits:
          nvidia.com/gpu: 1
