---
apiVersion: v1
kind: Namespace
metadata:
  name: forgejo
  labels:
    # Lets Forgejo's HTTPRoute attach to traefik-gateway (see traefik/helm/postCertManager.yaml).
    olympians/traefik-gateway: allowed
    # Talos enforces Pod Security Admission. The runners' docker:dind sidecar is privileged
    # (overlays/runners/runner.yaml), so the namespace must allow privileged pods.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
