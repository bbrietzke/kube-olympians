# Forgejo's credentials, from Bitwarden Secrets Manager through the "bitwarden" ClusterSecretStore
# (external-secrets/). One DB password (Bitwarden db/forgejo-db-credentials/password) feeds both the
# role's Secret in db and Forgejo's copy, so the two can't drift apart.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-db-credentials
  namespace: db
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: bitwarden}
  target:
    # The PostgreSQL login for the "forgejo" role, read by CloudNativePG (DatabaseRole).
    name: forgejo-db-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: forgejo
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: db/forgejo-db-credentials/password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-database
  namespace: forgejo
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: bitwarden}
  target:
    # Forgejo's copy (FORGEJO__DATABASE__PASSWD, key "password").
    name: forgejo-database
    creationPolicy: Owner
    template:
      data:
        username: forgejo
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: db/forgejo-db-credentials/password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-admin
  namespace: forgejo
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: bitwarden}
  target:
    # Initial admin account (chart gitea.admin.existingSecret: keys username, password).
    name: forgejo-admin
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: forgejo/forgejo-admin/username
    - secretKey: password
      remoteRef:
        key: forgejo/forgejo-admin/password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-runner
  namespace: forgejo
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: bitwarden}
  target:
    # Pre-shared runner credentials, one token/uuid pair per runner (see overlays/runners).
    name: forgejo-runner
    creationPolicy: Owner
  data:
    - secretKey: token-0
      remoteRef: {key: forgejo/forgejo-runner/token-0}
    - secretKey: uuid-0
      remoteRef: {key: forgejo/forgejo-runner/uuid-0}
    - secretKey: token-1
      remoteRef: {key: forgejo/forgejo-runner/token-1}
    - secretKey: uuid-1
      remoteRef: {key: forgejo/forgejo-runner/uuid-1}
