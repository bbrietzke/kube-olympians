apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: forgejo-runners-kustomization
# Two Forgejo Actions runners (StatefulSet with dind sidecars). Registered by `make runners`.
resources:
- runner.yaml

configMapGenerator:
  - name: forgejo-runner-config
    namespace: forgejo
    files:
      - config.yml

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
