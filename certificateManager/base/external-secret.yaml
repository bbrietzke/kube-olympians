# The Cloudflare API token for DNS-01 (ClusterIssuer letsencrypt-dns01), from Bitwarden Secrets
# Manager through the "bitwarden" ClusterSecretStore (external-secrets/). Bitwarden secret:
# cert-manager/cloudflare-api-token-secret/api-token
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    # The ClusterIssuer refers to the Secret by this exact name.
    name: cloudflare-api-token-secret
    creationPolicy: Owner
  data:
    - secretKey: api-token
      remoteRef:
        key: cert-manager/cloudflare-api-token-secret/api-token
