apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: certmanager-base-kustomized
# The ClusterIssuer reads its Cloudflare token Secret from the cert-manager namespace.
namespace: cert-manager
resources:
  - issuers.yaml
  # The Cloudflare API token, from Bitwarden (needs external-secrets/ first).
  - external-secret.yaml
